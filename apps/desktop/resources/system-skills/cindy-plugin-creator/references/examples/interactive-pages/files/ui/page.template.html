<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:14px/1.5 system-ui;margin:16px;color:var(--color-text-primary);background:var(--color-background-primary)}h1{font-size:20px}button,input{font:inherit;color:inherit;background:var(--color-background-secondary);border:1px solid var(--color-border-primary);border-radius:8px;padding:10px;min-height:44px}input{max-width:100%;box-sizing:border-box}button:disabled{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:8px}#drop{border:1px dashed var(--color-border-primary);padding:16px;margin:12px 0}img{max-width:100%;max-height:240px;object-fit:contain}progress{width:100%}li{overflow-wrap:anywhere}</style>
<h1>文件交互演示</h1><p>页面负责交互，文件处理交给插件。</p><div class="actions"><button id="pick-image">系统选择框选图</button><button id="pick-file">系统选择框选附件</button><button id="identity">核对企业后端连接</button><button id="download">下载后端附件</button><button id="save">另存为</button><button id="upload">处理并上传到后端</button><button id="send-image">把图发给 AI</button></div><div id="drop">拖入或粘贴文件，也可以用此选择框：<input type="file"></div><img alt="选中的图片"><progress></progress><p id="status" role="status">等待操作</p><ul id="files"></ul><!-- APP_SCRIPT -->
